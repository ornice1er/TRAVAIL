      <div class="container-custom">
        <div class="text-center ">
          <h1 class="text-4xl lg:text-5xl font-bold mb-6">Concours</h1>
          <p
            class="text-xl text-primary-100 dark:text-primary-200 max-w-3xl mx-auto"
          >
            Restez informé des concours et avenants
          </p>
        </div>
      </div>
    </div>

    <!-- Actualité à la une -->

      class="py-8 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700"
      aria-label="Filtres par catégorie"
    >
      <div class="container-custom">
        <div
          class="flex flex-col md:flex-row items-center justify-center gap-6"
        >
          <!-- Filtres par catégorie -->

    <!-- Liste des actualités -->
    <section
      class="section-padding bg-gray-50 dark:bg-gray-800"
      aria-label="Liste des actualités"
    >
      <div class="container-custom py-8">
  <div
    class="space-y-6"
    role="list"
  >
    <article
      *ngFor="
        let concour of concoursFiltrees | paginate: {
            id: 'concour_id',
            itemsPerPage: pg.pageSize,
            currentPage: pg.page,
            totalItems: pg.total
          };
        trackBy: trackByActualiteId
      "
      class="group flex flex-col md:flex-row items-start bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 p-6"
      role="listitem"
    >
      <!-- Bandeau coloré à gauche -->
      <div
        class="hidden md:block w-2 rounded-lg bg-primary-700 dark:bg-primary-600 mr-5 flex-shrink-0"
      ></div>

      <!-- Contenu principal -->
      <div class="flex-1">
        <!-- Catégorie et date -->
        <div class="flex flex-wrap items-center gap-2 text-sm text-gray-500 dark:text-gray-400 mb-2">
          <span
            class="bg-primary-100 dark:bg-primary-900/40 text-primary-800 dark:text-primary-300 px-2 py-0.5 rounded-full font-medium"
          >
           Concours
          </span>
          <span class="flex items-center space-x-1">
            <svg
              class="w-4 h-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10m-11 5h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v7a2 2 0 002 2z"
              />
            </svg>
            <span>{{ concour.created_at | date: 'd MMMM yyyy' : 'fr' }}</span>
          </span>
        </div>

        <!-- Titre -->
         <a
            [routerLink]="['/concours', concour.slug]"
            class="inline-flex items-center text-primary-700 dark:text-primary-400 font-medium hover:underline"
          >
        <h3
          class="text-xl font-semibold cursor-pointer text-gray-900 dark:text-white mb-3 group-hover:text-primary-700 dark:group-hover:text-primary-400 transition-colors line-clamp-2"
        >
          {{ concour.title }}
        </h3>
          </a>

        <!-- Description courte -->
      <p class="text-gray-600 dark:text-gray-300 text-sm mb-4 line-clamp-3 rich-content "
   [innerHTML]="(concour.description | slice:0:150) + (concour.description.length > 150 ? '...' : '')">
</p>

        <!-- Pied -->
        <div class="flex items-center justify-between mt-auto">
          <a
            [routerLink]="['/concours', concour.slug]"
            class="inline-flex items-center text-primary-700 dark:text-primary-400 font-medium hover:underline"
          >
            Lire plus
            <svg
              class="w-4 h-4 ml-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a>

          <div *ngIf="concour.tags?.length" class="flex space-x-2">
            <span
              *ngFor="let tag of concour.tags.slice(0, 2)"
              class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-1 rounded-full text-xs font-medium"
            >
              #{{ tag }}
            </span>
          </div>
        </div>
      </div>
    </article>
  </div>


        <!-- Pagination -->
         <ul class="flex justify-center mt-12 list-none space-x-2" *ngIf="concoursFiltrees.length > 0">

          <pagination-controls  id="concour_id"
                      (pageChange)="pageChanged($event)"
                      (pageBoundsCorrection)="pageChanged($event)"
                      [maxSize]="pg.total"
                      [directionLinks]="true"
                      [autoHide]="true"
                      [responsive]="true"
                      [previousLabel]="'Précédent'"
                      [nextLabel]="'Suivant'"
                      screenReaderPaginationLabel="Pagination"
                      screenReaderPageLabel="page"
                      screenReaderCurrentLabel="Page active"
                      >
</pagination-controls>
      </ul>
      </div>
    </section>
