<div *ngIf="visible"
     class="fixed bottom-0 left-0 right-0 z-[1500] bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 shadow-2xl animate-fade-in"
     role="region"
     aria-label="Gestion des cookies">
  <div class="container-custom py-5">
    <div class="flex flex-col lg:flex-row lg:items-center gap-4 lg:gap-8">

      <div class="flex items-start gap-3 flex-1">
        <span class="hidden sm:flex flex-shrink-0 w-10 h-10 rounded-lg bg-primary-50 dark:bg-primary-900/30 text-primary-800 dark:text-primary-400 items-center justify-center" aria-hidden="true">
          <i class="fas fa-cookie-bite text-lg"></i>
        </span>
        <p class="text-sm text-gray-600 dark:text-gray-300 text-content">
          Ce site utilise des cookies pour améliorer votre expérience de navigation et
          mesurer l'audience. Vous pouvez accepter ou refuser leur utilisation.
          <a routerLink="/contact" class="text-primary-800 dark:text-primary-400 font-medium">En savoir plus</a>.
        </p>
      </div>

      <div class="flex flex-shrink-0 gap-3">
        <button type="button"
                (click)="refuser()"
                class="btn-secondary py-2 px-5 text-sm">
          Tout refuser
        </button>
        <button type="button"
                (click)="accepter()"
                class="btn-primary py-2 px-5 text-sm">
          Tout accepter
        </button>
      </div>

    </div>
  </div>
</div>
