# /etc/nginx/sites-available/travail.gouv.bj
#
#   https://travail.gouv.bj/          -> front Angular (TRAVAIL/dist/travail/browser)
#   https://travail.gouv.bj/backend/  -> API Laravel   (TRAVAIL-API/public)
#   https://travail.gouv.bj/sistfp/   -> application SISTFP (proxy 127.0.0.1:9080)
#
# Les lignes « managed by Certbot » du bloc existant sont à conserver telles quelles.

# Connection: upgrade uniquement quand le client le demande (WebSocket / SSE).
# Envoyé systématiquement, cet en-tête casse le keep-alive vers le backend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name www.travail.gouv.bj travail.gouv.bj;

    # ------------------------------------------------------------------
    # Front Angular
    # ------------------------------------------------------------------
    root  /home/admin/projects/TRAVAIL/dist/travail/browser;
    index index.html;

    # Téléversements (actualités, communiqués, appels d'offres).
    # À garder cohérent avec upload_max_filesize / post_max_size de PHP.
    client_max_body_size 64m;

    charset utf-8;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml
                    application/manifest+json;

    # Routage SPA : toute URL inconnue rend index.html, c'est Angular qui route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache, sinon un déploiement ne sort jamais.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Les bundles Angular portent un hash dans leur nom : cache long.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ------------------------------------------------------------------
    # Backend Laravel sous /backend
    # ------------------------------------------------------------------
    location = /backend {
        return 301 /backend/;
    }

    # ^~ : ce préfixe l'emporte sur les regex du serveur (le bloc statique
    # ci-dessus ne doit pas intercepter /backend/storage/xxx.png).
    location ^~ /backend/ {
        alias /home/admin/projects/TRAVAIL-API/public/;
        index index.php;

        # Fichier réel s'il existe, sinon on passe la main à Laravel.
        try_files $uri $uri/ @laravel;

        # --- l'ordre des blocs imbriqués ci-dessous compte ---

        location ~ /\. {
            deny all;
        }

        # Fichiers téléversés : servis tels quels, jamais exécutés par PHP.
        location ~ ^/backend/storage/(?<storage_file>.+)$ {
            alias      /home/admin/projects/TRAVAIL-API/public/storage/$storage_file;
            add_header X-Content-Type-Options nosniff;
            expires    30d;
            access_log off;
        }

        location ~ ^/backend/(?<script>.+\.php)(?<path_info>/.*)?$ {
            include      fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;

            # Renseignés à la main : avec alias, $document_root et
            # $request_filename ne donnent pas le bon chemin.
            # SCRIPT_NAME = /backend/index.php : c'est ce qui permet à Laravel
            # de déduire son préfixe et de générer des URL en /backend/...
            fastcgi_param DOCUMENT_ROOT   /home/admin/projects/TRAVAIL-API/public;
            fastcgi_param SCRIPT_FILENAME /home/admin/projects/TRAVAIL-API/public/$script;
            fastcgi_param SCRIPT_NAME     /backend/$script;
            fastcgi_param PATH_INFO       $path_info;

            fastcgi_read_timeout 120s;
            fastcgi_buffer_size  32k;
            fastcgi_buffers      16 16k;
        }
    }

    # Front controller Laravel. La query string d'origine est réinjectée
    # automatiquement par rewrite, et REQUEST_URI reste l'URL demandée.
    location @laravel {
        rewrite ^ /backend/index.php last;
    }

    # ------------------------------------------------------------------
    # SISTFP
    # ------------------------------------------------------------------
    location /sistfp {
        proxy_pass http://127.0.0.1:9080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /sistfp;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;
    }

    # listen / ssl_certificate / ssl_certificate_key : lignes Certbot à conserver.
}
